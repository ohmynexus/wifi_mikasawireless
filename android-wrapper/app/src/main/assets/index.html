<!DOCTYPE html>
<html lang="id" data-theme="light" data-skin="casual">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>MIKASA WIRELESS</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Plus Jakarta Sans',sans-serif}
/* ============ MIKASA PREMIUM — Violet Glass ============ */
:root{
 --bg:#07060f;--surface:#12102b;--bg2:rgba(255,255,255,.05);--bg3:rgba(255,255,255,.075);--bd:rgba(255,255,255,.10);
 --tx:#f5f3ff;--tx2:#b3acd6;--tx3:#7c75a0;
 --blue:#8b6cff;--cyan:#7dd3fc;--purple:#c084fc;--green:#3ee6a8;--red:#ff6f91;--gold:#ffd27a;
 --grad:linear-gradient(135deg,#a259ff 0%,#6c5cff 50%,#4f7bff 100%);
 --grad-soft:linear-gradient(135deg,rgba(162,89,255,.22),rgba(79,123,255,.14));
 --glow-b:0 10px 34px rgba(124,92,255,.30);--glow-g:0 8px 24px rgba(62,230,168,.18);--glow-r:0 8px 24px rgba(255,111,145,.18);--glow-go:0 8px 24px rgba(255,210,122,.16);--glow-p:0 8px 24px rgba(192,132,252,.2);
 --shadow:0 18px 50px rgba(0,0,0,.35);--blur:blur(22px) saturate(160%);
 --r1:10px;--r2:14px;--r3:22px;--r4:30px
}
[data-theme="light"]{
 --bg:#f3f0ff;--surface:#ffffff;--bg2:rgba(255,255,255,.72);--bg3:rgba(108,84,230,.07);--bd:rgba(96,70,200,.14);
 --tx:#1b1438;--tx2:#5f5886;--tx3:#968fb8;
 --blue:#6a4cf5;--cyan:#2a8fd6;--purple:#9b4ff0;--green:#10a374;--red:#e5476f;--gold:#b7821a;
 --grad:linear-gradient(135deg,#9a55f7 0%,#6a4cf5 55%,#4a6df0 100%);
 --grad-soft:linear-gradient(135deg,rgba(154,85,247,.14),rgba(74,109,240,.10));
 --glow-b:0 10px 28px rgba(106,76,245,.22);--glow-g:0 8px 20px rgba(16,163,116,.14);--glow-r:0 8px 20px rgba(229,71,111,.14);--glow-go:0 8px 20px rgba(183,130,26,.12);--glow-p:0 8px 20px rgba(155,79,240,.16);
 --shadow:0 14px 40px rgba(70,50,150,.12)
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);min-height:100vh;font-size:13px;transition:background .3s,color .3s;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(ellipse 60% 45% at 10% -5%,rgba(139,92,246,.38),transparent 70%),radial-gradient(ellipse 50% 40% at 100% 10%,rgba(56,130,255,.24),transparent 70%),radial-gradient(ellipse 55% 45% at 50% 110%,rgba(192,70,255,.20),transparent 70%)}
[data-theme="light"] body:before{background:radial-gradient(ellipse 60% 45% at 10% -5%,rgba(160,110,255,.30),transparent 70%),radial-gradient(ellipse 50% 40% at 100% 10%,rgba(90,150,255,.20),transparent 70%),radial-gradient(ellipse 55% 45% at 50% 110%,rgba(220,150,255,.22),transparent 70%)}
.mono{font-family:'JetBrains Mono',monospace}
h1,h2,.brand,.detail-name,.sheet-title,.dash-title{font-family:'Sora','Plus Jakarta Sans',sans-serif}
.app{width:min(100%,1180px);margin:0 auto;min-height:100vh;padding:14px 22px calc(140px + env(safe-area-inset-bottom));position:relative}

/* ---------- Header ---------- */
.header{position:sticky;top:10px;z-index:100;display:block;background:var(--bg2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--bd);border-radius:24px;padding:14px 18px;margin-bottom:20px;box-shadow:var(--shadow)}
.header:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(162,89,255,.55),transparent 40%,rgba(79,123,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.brand{font-size:17px;font-weight:800;letter-spacing:1.6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.badge{background:var(--grad-soft);color:var(--purple);border:1px solid var(--bd);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.header-sub{font-size:11px;color:var(--tx2);font-weight:500;letter-spacing:.2px}
.profile-trigger{border:0;background:transparent;padding:0;cursor:pointer;flex:0 0 auto}
.profile-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--grad);color:#fff;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 0 4px rgba(139,108,255,.18),var(--glow-b)}
.profile-avatar img,.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.content{padding:4px 0 20px;min-height:60vh}
.content>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.content>*:nth-child(2){animation-delay:.05s}.content>*:nth-child(3){animation-delay:.1s}.content>*:nth-child(4){animation-delay:.15s}.content>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Surfaces ---------- */
.card,.tx-item,.stat-box,.home-panel,.home-stat{background:var(--bg2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--bd);border-radius:var(--r3);box-shadow:var(--shadow)}
.card{padding:18px;margin-bottom:14px;transition:border-color .3s,transform .3s,box-shadow .3s}
.card:hover,.tx-item:hover{border-color:rgba(162,120,255,.45);box-shadow:var(--glow-b);transform:translateY(-2px)}
.tx-item{padding:15px;margin-bottom:10px;border-radius:18px;background:var(--bg3);box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-box{padding:14px}

/* ---------- Buttons & forms ---------- */
.btn{background:var(--grad);color:#fff;border:0;padding:13px 18px;border-radius:15px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--glow-b),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,filter .2s,box-shadow .2s;letter-spacing:.15px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn-full{width:100%}
.btn-green{background:linear-gradient(135deg,#22c993,#12a678);box-shadow:var(--glow-g),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-red{background:linear-gradient(135deg,#ff6f91,#e0446c);box-shadow:var(--glow-r),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-ghost{background:var(--bg3);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn-ghost:hover{border-color:rgba(162,120,255,.5)}
.btn-sm{padding:7px 12px;font-size:11px;border-radius:11px}
.btn-danger{background:rgba(255,111,145,.12)!important;color:var(--red)!important;border:1px solid rgba(255,111,145,.28)!important;box-shadow:none!important}
.btn-link{background:transparent;border:0;color:var(--purple);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:var(--r1)}
.btn-link:hover{background:var(--grad-soft)}
.btn-del{background:rgba(255,111,145,.12);color:var(--red);border:1px solid rgba(255,111,145,.25);padding:7px 11px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer}
.input,.select,.textarea,.search-input{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:15px;padding:13px 14px;color:var(--tx);font-size:14px;outline:0;transition:border-color .25s,box-shadow .25s,background .25s;font-family:'Plus Jakarta Sans',sans-serif}
.input:focus,.select:focus,.textarea:focus,.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(139,108,255,.18)}
.select option{background:var(--surface);color:var(--tx)}
.textarea{min-height:84px;resize:vertical}
.form-group{margin-bottom:15px}
.form-label{display:block;font-size:11px;color:var(--tx2);font-weight:700;margin-bottom:7px;letter-spacing:.5px;text-transform:uppercase}
.form-hint{font-size:11px;color:var(--tx3);margin-top:6px}
.quick-amt{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.quick-btn{background:var(--bg3);border:1px solid var(--bd);color:var(--tx);padding:9px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s}
.quick-btn:active,.quick-btn:hover{background:var(--grad);color:#fff;border-color:transparent}
.radio-group{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.radio-btn{background:var(--bg3);border:1.5px solid var(--bd);color:var(--tx2);padding:12px;border-radius:15px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s}
.radio-btn.active{border-color:var(--blue);background:var(--grad-soft);color:var(--tx);box-shadow:var(--glow-b)}
.search-bar{position:relative;margin-bottom:13px;max-width:640px}
.search-input{padding-left:44px;border-radius:18px}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--tx2);width:18px;height:18px}
.filter-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);padding:9px 16px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.filter-btn.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow-b)}

/* ---------- Navigation dock ---------- */
.nav-dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:12px;width:min(calc(100% - 28px),560px)}
.nav-dock .nav{position:static;flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:7px;background:var(--bg2);background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--bd);border-radius:28px;box-shadow:0 18px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
[data-theme="light"] .nav-dock .nav{box-shadow:0 14px 36px rgba(70,50,150,.18)}
.nav-dock .nav-item,.nav-dock .nav-item.center{min-width:0;min-height:48px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border:1px solid transparent;border-radius:20px;background:transparent;color:var(--tx3);cursor:pointer;transition:all .25s;white-space:nowrap}
.nav-dock .nav-item.active,.nav-dock .nav-item.center.active{background:var(--grad-soft);color:var(--purple);border-color:rgba(162,120,255,.35);box-shadow:0 0 22px rgba(139,108,255,.25)}
[data-theme="light"] .nav-dock .nav-item.active{color:var(--blue)}
.nav-dock .nav-item svg{stroke:currentColor!important}
.nav-dock .nav-icon{width:21px;height:21px;flex:0 0 auto}
.nav-dock .nav-label{font-size:10px;font-weight:700;line-height:1.2;letter-spacing:-.1px}
.nav-add{width:58px;height:58px;flex:0 0 58px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;background:var(--grad);box-shadow:0 12px 30px rgba(124,92,255,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s}
.nav-add:hover{transform:translateY(-2px) rotate(90deg);transition:transform .3s}
.nav-add:active{transform:scale(.92)}
.nav-add svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---------- Sheets / overlay / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,3,18,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;opacity:0;visibility:hidden;transition:all .3s}
.overlay.active{opacity:1;visibility:visible}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:520px;background:var(--surface);border:1px solid var(--bd);border-bottom:0;border-top-left-radius:32px;border-top-right-radius:32px;z-index:201;transition:transform .38s cubic-bezier(.22,.8,.2,1);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.45)}
.sheet:before{content:"";position:absolute;top:0;left:0;right:0;height:140px;border-radius:inherit;background:radial-gradient(ellipse 70% 100% at 50% 0,rgba(139,108,255,.22),transparent 75%);pointer-events:none}
.sheet.active{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:44px;height:5px;background:var(--bd);border-radius:3px;margin:12px auto 8px;position:relative}
.sheet-head{padding:6px 22px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:relative}
.sheet-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.sheet-body{padding:22px;flex:1;position:relative}
.close-btn{background:var(--bg3);border:1px solid var(--bd);color:var(--tx);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.close-btn:hover{background:var(--red);color:#fff;border-color:transparent}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:18px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:slideDown .35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:9px;backdrop-filter:blur(14px);max-width:calc(100% - 28px)}
.toast.success{background:linear-gradient(135deg,#22c993,#12a678);color:#fff}
.toast.error{background:linear-gradient(135deg,#ff6f91,#e0446c);color:#fff}
.toast.info{background:var(--grad);color:#fff}
@keyframes slideDown{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- Avatars ---------- */
.avatar{width:48px;height:48px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;box-shadow:var(--glow-p),inset 0 1px 0 rgba(255,255,255,.3);overflow:hidden}
.avatar.big{width:80px;height:80px;font-size:28px;margin:0 auto 12px;border-radius:50%}
.avatar.sm{width:40px;height:40px;font-size:13px;border-radius:14px}
.profile-hero{text-align:center;padding:20px 12px 24px}
.profile-large{width:108px;height:108px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--grad);color:#fff;font-size:28px;font-weight:800;border:3px solid rgba(255,255,255,.3);box-shadow:0 0 0 6px rgba(139,108,255,.18),var(--glow-b)}
.profile-large img{width:100%;height:100%;object-fit:cover}
.profile-camera{display:inline-flex;align-items:center;gap:6px;margin-top:10px}
.profile-back{margin-bottom:12px}

/* ---------- Customer list ---------- */
.cust-head{display:flex;gap:13px;align-items:center;margin-bottom:13px;cursor:pointer}
.cust-name{font-weight:800;font-size:15px;margin-bottom:3px;letter-spacing:-.2px}
.cust-meta{font-size:11px;color:var(--tx2);display:flex;gap:8px;align-items:center}
.cust-xp{color:var(--gold);font-weight:700}
.debt-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(135deg,rgba(255,111,145,.12),rgba(255,111,145,.04));border:1px solid rgba(255,111,145,.2);border-radius:16px;margin-bottom:11px}
.debt-label{font-size:12px;color:var(--tx2);font-weight:600}
.debt-val{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px;color:var(--red)}

/* v32 transaction card layout (approved) */
.list-tx-layout{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:14px;row-gap:10px}
.list-tx-info{min-width:0}
.list-tx-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:116px}
.list-tx-actions .tx-amt{font-size:14px;white-space:nowrap}
.list-tx-actions .btn{margin:0!important;white-space:nowrap}
@media(max-width:390px){.list-tx-layout{grid-template-columns:minmax(0,1fr) 112px;column-gap:8px}.list-tx-actions{min-width:0}.list-tx-actions .tx-amt{font-size:12px}.list-tx-actions .btn{padding:9px 10px;font-size:11px}}
.tx-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;gap:14px}
.tx-head>div:first-child{flex:1;min-width:0}
.tx-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:8px}
.tx-actions .btn{margin-top:0!important;white-space:nowrap}
.tx-side{flex:0 0 auto;min-width:128px;text-align:right}
.tx-actions .tx-action-button{display:flex!important;align-items:center!important;justify-content:center!important}
.tx-actions .tx-action-content{display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:18px;white-space:nowrap}
.tx-actions .tx-action-content .tx-edit-icon{display:block!important;width:18px!important;height:18px!important;flex:0 0 18px!important;margin:0!important;align-self:center!important;transform:translateY(1px)}
.tx-actions .tx-action-content .tx-action-label{display:block;height:18px;margin:0;padding:0;line-height:18px!important;align-self:center}
@media(max-width:420px){
 .tx-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:10px;row-gap:10px}
 .tx-head>div:first-child{min-width:0;flex:initial}
 .tx-side{display:contents}
 .tx-side>.tx-amt,.tx-side>div:not(.tx-actions){grid-column:2;text-align:right}
 .tx-actions{grid-column:1 / -1;display:flex;flex-direction:row;justify-content:stretch;gap:8px;width:100%;margin-top:2px}
 .tx-actions .btn{flex:1 1 0;min-width:0;padding:9px 8px;font-size:11px}
}
.tx-title{font-weight:800;font-size:14px;letter-spacing:-.2px}
.tx-meta{font-size:11px;color:var(--tx2);margin-bottom:4px}
.badge-status{display:inline-block;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.2px}
.badge-unpaid{background:rgba(255,111,145,.14);color:var(--red);border:1px solid rgba(255,111,145,.25)}
.badge-partial{background:rgba(192,132,252,.15);color:var(--purple);border:1px solid rgba(192,132,252,.28)}
.badge-paid{background:rgba(62,230,168,.13);color:var(--green);border:1px solid rgba(62,230,168,.26)}
.tx-amt{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px}
.tx-amt.red{color:var(--red)}.tx-amt.green{color:var(--green)}

/* ---------- Customer detail ---------- */
.detail-head{text-align:center;padding:20px 0}
.detail-name{font-size:20px;font-weight:800;margin-bottom:4px;letter-spacing:-.4px}
.detail-notes{font-size:12px;color:var(--tx2);margin-bottom:12px}
.detail-head-compact{display:flex;align-items:center;gap:15px;text-align:left;padding:14px 0 20px;min-width:0}
.detail-head-compact .avatar.big{width:70px;height:70px;flex:0 0 70px;font-size:24px;margin:0}
.detail-identity{min-width:0;flex:1}
.detail-head-compact .detail-name{font-size:22px;line-height:1.2;margin-bottom:8px;overflow-wrap:anywhere}
.detail-level{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.detail-level-badge,.detail-xp-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.detail-level-badge{background:var(--grad-soft);color:var(--purple);border:1px solid rgba(162,120,255,.3)}
.detail-xp-badge{background:rgba(255,210,122,.12);color:var(--gold);border:1px solid rgba(255,210,122,.26)}
.detail-head-compact .detail-notes{font-size:12px;margin:0;overflow-wrap:anywhere}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);backdrop-filter:var(--blur);border:1px solid var(--bd);border-radius:20px;padding:5px;margin-bottom:16px;gap:3px}
.tab-btn{background:transparent;border:0;color:var(--tx2);padding:10px 4px;border-radius:15px;font-size:11px;font-weight:700;cursor:pointer;transition:all .25s;line-height:1.4}
.tab-btn.active{background:var(--grad);color:#fff;box-shadow:var(--glow-b)}
.stat-label{font-size:11px;color:var(--tx2);margin-bottom:5px;font-weight:600}
.stat-val{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:16px}
.profile-stats .stat-box{min-width:0;padding:16px}
.profile-stats .stat-label{line-height:1.35}
.profile-stats .stat-val{font-size:clamp(14px,3.8vw,19px);overflow-wrap:anywhere;line-height:1.35}
.profile-xp-card{margin-top:10px!important;padding:16px!important}
.profile-xp-top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.profile-xp-value{font-size:20px;color:var(--gold);line-height:1.3}
.profile-xp-total{font:700 11px 'JetBrains Mono',monospace;color:var(--gold);white-space:nowrap}
.profile-xp-track{height:9px;background:var(--bg3);border-radius:999px;overflow:hidden;margin-top:11px}
.profile-xp-track>div{height:100%;background:linear-gradient(90deg,#ffb84d,#ffe08a);border-radius:inherit;box-shadow:0 0 14px rgba(255,210,122,.5)}
.profile-xp-foot{font-size:11px;color:var(--tx3);margin-top:8px}

/* ---------- Dashboard (Beranda) ---------- */
.home-welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:6px 2px 20px}
.home-eyebrow,.home-section-kicker{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--purple)}
.home-live-dot{display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(62,230,168,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(62,230,168,0)}100%{box-shadow:0 0 0 0 rgba(62,230,168,0)}}
.home-welcome h1{font-size:clamp(26px,3.2vw,36px);letter-spacing:-1px;margin:6px 0 4px;background:linear-gradient(120deg,var(--tx) 30%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.home-welcome p{font-size:13px;color:var(--tx2)}
.home-date{padding:9px 14px;background:var(--bg2);backdrop-filter:var(--blur);border:1px solid var(--bd);border-radius:999px;color:var(--tx2);font-size:11px;font-weight:700;white-space:nowrap}
.home-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.home-stat{position:relative;overflow:hidden;padding:17px;min-width:0;transition:transform .3s,border-color .3s}
.home-stat:hover{transform:translateY(-3px);border-color:rgba(162,120,255,.45)}
.home-stat:after{content:"";position:absolute;right:-30px;bottom:-50px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(139,108,255,.28),transparent 70%);pointer-events:none}
.home-stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.home-stat-icon{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:22px;font-weight:800;border:1px solid var(--bd)}
.home-stat-icon.blue{color:#9fb4ff;background:rgba(99,125,255,.18)}
.home-stat-icon.red{color:var(--red);background:rgba(255,111,145,.15)}
.home-stat-icon.green{color:var(--green);background:rgba(62,230,168,.14)}
.home-stat-icon.amber{color:var(--gold);background:rgba(255,210,122,.14)}
.home-stat-kicker{font-size:8px;letter-spacing:1px;color:var(--tx3);font-weight:800}
.home-stat-label{font-size:12px;color:var(--tx2);font-weight:600}
.home-stat-value{font-size:clamp(19px,2.2vw,28px);font-weight:800;letter-spacing:-.8px;overflow-wrap:anywhere;margin:6px 0 8px;font-variant-numeric:tabular-nums;font-family:'Sora','Plus Jakarta Sans',sans-serif}
.home-stat-value.red{color:var(--red)}.home-stat-value.green{color:var(--green)}
.home-stat-foot{font-size:10px;color:var(--tx3)}
.home-quick-actions{display:flex;gap:10px;margin:16px 0 20px}
.home-quick-actions .btn{width:auto}
.home-lower{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.9fr);gap:14px;align-items:start}
.home-panel{padding:20px;min-width:0}
.home-activities{grid-row:span 2}
.home-panel-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.home-section-kicker{font-size:9px}
.home-panel-heading h2{font-size:17px;letter-spacing:-.4px;margin-top:3px}
.home-activity-row,.home-bill-row,.home-customer-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--bd);min-width:0}
.home-activity-row:last-child,.home-bill-row:last-child,.home-customer-row:last-child{border-bottom:0}
.home-activity-icon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;font-weight:800;flex-shrink:0;border:1px solid var(--bd)}
.home-activity-icon.paid{background:rgba(62,230,168,.14);color:var(--green)}
.home-activity-icon.change{background:rgba(139,108,255,.18);color:var(--purple)}
.home-activity-copy,.home-bill-copy,.home-customer-copy{flex:1;min-width:0}
.home-activity-copy b,.home-bill-copy b,.home-customer-copy b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-activity-copy small,.home-bill-copy small,.home-customer-copy small{display:block;color:var(--tx2);font-size:10px;margin-top:4px}
.home-activity-amount{font-size:12px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.home-activity-amount.positive{color:var(--green)}.home-activity-amount.muted{color:var(--tx3)}
.home-activity-tag{font-size:9px;color:var(--tx2);background:var(--bg3);padding:5px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--bd)}
.home-bill-row,.home-customer-row{cursor:pointer;transition:transform .2s}
.home-bill-row:hover,.home-customer-row:hover{transform:translateX(4px)}
.home-bill-mark{width:38px;height:38px;display:grid;place-items:center;background:rgba(255,111,145,.14);color:var(--red);font-weight:800;border-radius:13px;font-size:11px;border:1px solid rgba(255,111,145,.2)}
.home-bill-total{text-align:right;flex-shrink:0}
.home-bill-total b{font-size:11px;display:block;color:var(--red);white-space:nowrap;font-family:'JetBrains Mono',monospace}
.home-bill-total small{font-size:9px;color:var(--tx2)}
.home-customer-avatar{width:40px;height:40px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;box-shadow:var(--glow-p)}
.home-customer-arrow{color:var(--tx3);font-size:22px}
.home-empty{padding:24px 6px;display:grid;gap:5px;color:var(--tx2);font-size:12px}
.home-empty small{font-size:10px;color:var(--tx3)}

/* ---------- Status ---------- */
.priority-item{display:flex;gap:12px;align-items:center;padding:14px;background:linear-gradient(135deg,rgba(255,111,145,.10),var(--bg3));border:1px solid var(--bd);border-left:3px solid var(--red);border-radius:18px;margin-bottom:10px;cursor:pointer;transition:all .25s}
.priority-item:hover{transform:translateX(4px);box-shadow:var(--glow-r)}
.priority-info{flex:1;min-width:0}
.priority-name{font-weight:700;font-size:14px;margin-bottom:2px}
.priority-meta{font-size:11px;color:var(--tx2);margin-bottom:2px}
.priority-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,111,145,.14);color:var(--red);padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;margin-top:5px}
.priority-amt{text-align:right;flex-shrink:0}
.priority-val{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px;color:var(--red);margin-bottom:8px}
.ranking-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg3);border:1px solid var(--bd);border-radius:18px;margin-bottom:9px;cursor:pointer;transition:all .25s}
.ranking-item:hover{border-color:rgba(162,120,255,.45);transform:translateX(4px);box-shadow:var(--glow-b)}
#mainContent .ranking-item{display:flex;flex-direction:row;align-items:center;min-height:72px;height:auto;text-align:left}
#mainContent .ranking-item .ranking-info{flex:1;min-width:0}
#mainContent .ranking-item .ranking-xp{flex-shrink:0;white-space:nowrap}
#modalBody .status-modal-ranking{display:flex;flex-direction:row;align-items:center;text-align:left;min-height:64px;height:auto}
.ranking-medal{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.medal-gold{background:linear-gradient(135deg,#ffe27a,#ffa530);color:#fff;box-shadow:var(--glow-go)}
.medal-silver{background:linear-gradient(135deg,#dfe3ee,#8f98ad);color:#fff}
.medal-bronze{background:linear-gradient(135deg,#e0975a,#9a5628);color:#fff}
.ranking-info{flex:1;min-width:0}
.ranking-name{font-weight:700;font-size:13px;margin-bottom:2px}
.ranking-level{font-size:11px;color:var(--tx2)}
.ranking-xp{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--gold)}
.activity-item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--bd)}
.activity-item:last-child{border-bottom:0}
.activity-info{flex:1;min-width:0}
.activity-name{font-weight:700;font-size:13px;margin-bottom:2px}
.activity-time{font-size:11px;color:var(--tx2);margin-bottom:5px}
.activity-status{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700}
.status-valid{background:rgba(62,230,168,.13);color:var(--green)}
.status-rejected{background:rgba(255,111,145,.14);color:var(--red)}
.activity-right{text-align:right;flex-shrink:0}
.activity-amt{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:13px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;padding:0 4px}
.section-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.2px}
.section-icon{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd)}
.icon-red{background:rgba(255,111,145,.14);color:var(--red)}
.icon-gold{background:rgba(255,210,122,.14);color:var(--gold)}
.icon-cyan{background:rgba(125,211,252,.14);color:var(--cyan)}
.icon-blue{background:rgba(139,108,255,.18);color:var(--purple)}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-svg{position:relative;width:120px;height:120px;flex-shrink:0}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-amt{font-size:13px;font-weight:900;font-family:'JetBrains Mono',monospace}
.donut-lbl{font-size:10px;color:var(--tx2);font-weight:700}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:12px}
.donut-legend-item{display:flex;align-items:center;gap:9px}
.donut-dot{width:10px;height:10px;border-radius:4px;flex-shrink:0}
.donut-legend-info{flex:1;min-width:0}
.donut-legend-label{font-size:11px;color:var(--tx2);font-weight:700}
.donut-legend-val{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace}

/* ---------- Insight ---------- */
.bar-chart{display:flex;align-items:flex-end;gap:12px;height:180px;padding:10px 0;border-bottom:1px solid var(--bd);background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--bd) 44px)}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:min(100%,56px);background:var(--grad);border-radius:12px 12px 4px 4px;min-height:4px;box-shadow:var(--glow-b);transition:transform .3s,filter .3s;transform-origin:bottom}
.bar:hover{transform:scaleY(1.04);filter:brightness(1.12)}
.bar-label{font-size:10px;color:var(--tx2);font-weight:700;text-align:center;margin-top:6px}
.bar-value{font-size:9px;color:var(--tx);font-weight:800;font-family:'JetBrains Mono',monospace}

/* ---------- Settings ---------- */
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .2s}
.settings-item:last-child{border-bottom:0}
.settings-item:hover,.settings-item:active{background:var(--bg3)}
.settings-left{display:flex;align-items:center;gap:14px}
.settings-icon{width:38px;height:38px;background:var(--grad-soft);border:1px solid var(--bd);color:var(--purple);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:16px}
.settings-text{font-size:14px;font-weight:700}
.settings-sub{font-size:11px;color:var(--tx2);margin-top:3px}
.label-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg3);border:1px solid var(--bd);border-radius:16px;margin-bottom:9px}
.label-name{font-weight:700;font-size:13px}

/* ---------- Empty / footer / icons ---------- */
.empty{text-align:center;padding:40px 20px}
.empty-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:24px;background:var(--grad-soft);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--purple);box-shadow:var(--glow-b);font-size:32px}
.empty-title{font-weight:800;font-size:14px;margin-bottom:5px}
.empty-desc{font-size:12px;color:var(--tx2)}
.footer{margin:24px 0 8px;padding:20px 12px 14px;text-align:center;color:var(--tx3);font-size:11px;border-top:1px solid var(--bd)}
.footer-brand{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tx);font-size:13px;font-weight:800;letter-spacing:1.2px;margin-bottom:6px}
.footer-brand-mark{color:var(--purple);font-size:20px;line-height:1}
.footer-tagline{font-size:11px;color:var(--tx2);margin-bottom:8px}
.footer-meta{font-size:10px;color:var(--tx3)}
.ui-icon{display:inline-block;vertical-align:-.16em;flex:0 0 auto}
.settings-icon .ui-icon{width:21px;height:21px}
.btn .ui-icon{width:16px;height:16px;margin-right:5px}
.empty-icon .ui-icon{width:30px;height:30px}
.home-stat-icon .ui-icon{width:22px;height:22px}
.toast .ui-icon{width:16px;height:16px}

/* ---------- Responsive ---------- */
@media(max-width:1000px){.home-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.home-lower{grid-template-columns:minmax(0,1fr)}.home-activities{grid-row:auto}}
@media(max-width:640px){
 .app{padding:8px 14px calc(140px + env(safe-area-inset-bottom))}
 .header{top:8px;padding:12px 15px;border-radius:21px;margin-bottom:16px}
 .brand{font-size:15px}
 .profile-avatar{width:40px;height:40px}
 .home-welcome h1{font-size:26px}.home-welcome p{font-size:11px;max-width:230px;line-height:1.5}.home-date{font-size:9px;padding:8px 10px}
 .home-stats{gap:10px}.home-stat{padding:14px;border-radius:20px}.home-stat-top{margin-bottom:12px}.home-stat-icon{width:38px;height:38px}.home-stat-kicker{font-size:7px}.home-stat-label{font-size:11px}.home-stat-value{font-size:clamp(17px,5vw,23px)}
 .home-quick-actions{margin:13px 0 16px}.home-quick-actions .btn{flex:1;padding:12px 8px;font-size:11px}
 .home-panel{padding:16px;border-radius:21px}
 .card{padding:16px;border-radius:21px}
 .grid2{gap:10px}
 .detail-head-compact .avatar.big{width:64px;height:64px;flex-basis:64px;font-size:23px}
 .detail-head-compact .detail-name{font-size:20px}
 .profile-stats{gap:10px;margin-bottom:12px}
 .nav-dock{left:14px;right:14px;width:auto;transform:none;gap:9px;bottom:calc(10px + env(safe-area-inset-bottom))}
 .nav-dock .nav{padding:6px 4px;border-radius:26px}
 .nav-add{width:54px;height:54px;flex-basis:54px}
 .donut-wrap{gap:14px}.donut-svg{width:108px;height:108px}.donut-svg svg{width:108px;height:108px}
}
@media(max-width:360px){.nav-dock{left:10px;right:10px;gap:6px}.nav-add{width:48px;height:48px;flex-basis:48px}.nav-dock .nav{padding:5px 2px}.nav-dock .nav-icon{width:19px;height:19px}.nav-dock .nav-label{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* v33.1: sejajarkan ikon pensil + teks "Edit" pada tombol di header detail pelanggan (hanya tombol ini) */
.detail-edit-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1}
.detail-edit-btn .ui-icon{width:16px;height:16px;margin:0;vertical-align:baseline;display:block;flex:0 0 16px}
.detail-edit-btn .tx-action-label{display:block;line-height:16px}

/* v33.2: jam WITA di dashboard */
.home-time{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.home-clock{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:var(--grad-soft);border:1px solid rgba(162,120,255,.32);border-radius:999px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.home-clock small{font-size:9px;font-weight:800;color:var(--purple);letter-spacing:1px}
.home-clock-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@media(max-width:640px){.home-time{gap:5px}.home-clock{padding:7px 10px;font-size:12px;gap:6px}.home-clock small{font-size:8px}}

/* ===== v34: Kunci PIN, Laporan & Struk, Insight lanjutan ===== */
body.is-locked{overflow:hidden}
.lock-screen{position:fixed;inset:0;z-index:9000;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse 70% 50% at 20% 0,rgba(139,92,246,.4),transparent 70%),radial-gradient(ellipse 60% 45% at 90% 100%,rgba(56,130,255,.28),transparent 70%),var(--bg);overflow-y:auto}
.lock-card{width:min(100%,340px);text-align:center;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.lock-card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lock-logo{width:68px;height:68px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:var(--glow-b),inset 0 1px 0 rgba(255,255,255,.3)}
.lock-logo .ui-icon{width:30px;height:30px}
.lock-brand{font-family:'Sora','Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.lock-title{font-size:20px;font-weight:800;margin-bottom:20px;font-family:'Sora','Plus Jakarta Sans',sans-serif}
.lock-dots{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
.lock-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--tx3);transition:all .15s}
.lock-dots i.on{background:var(--grad);border-color:transparent;box-shadow:0 0 14px rgba(139,108,255,.7);transform:scale(1.12)}
.lock-msg{min-height:18px;font-size:12px;color:var(--tx2);margin-bottom:12px}
.lock-msg.err{color:var(--red);font-weight:700}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.lock-pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--bd);background:var(--bg2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--tx);font-size:24px;font-weight:700;font-family:'Sora','Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .12s,background .2s;display:grid;place-items:center}
.lock-pad button:active{transform:scale(.9);background:var(--grad);color:#fff}
.lock-pad button.lock-ghost{background:transparent;border-color:transparent;font-size:13px;color:var(--tx2);font-family:'Plus Jakarta Sans',sans-serif}
.lock-pad button.lock-ghost[aria-label]{font-size:22px}
.pin-note{font-size:12px;color:var(--tx2);line-height:1.6;margin-bottom:16px;padding:12px 14px;border-radius:16px;background:var(--grad-soft);border:1px solid var(--bd)}
.pin-status{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;margin-bottom:14px;border-radius:16px;background:rgba(62,230,168,.12);color:var(--green);font-weight:700;font-size:13px;border:1px solid rgba(62,230,168,.25)}
.pin-input{letter-spacing:8px;text-align:center;font-size:20px}

.rep-stats .stat-box{padding:13px}
.rep-stats .stat-val{font-size:15px;overflow-wrap:anywhere}
.rep-sm{font-size:10px;color:var(--tx3);margin-top:4px}
.rep-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 0 6px}
.rep-actions .btn{display:flex;align-items:center;justify-content:center;gap:6px}
.rep-actions .btn .ui-icon{margin:0}
.rep-sub{font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--tx2);margin:20px 0 8px;text-transform:uppercase}
.rep-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.rep-row:last-child{border-bottom:0}
.rep-main{flex:1;min-width:0}
.rep-main b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-main small{display:block;font-size:10px;color:var(--tx2);margin-top:3px}
.rep-amt{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12px;color:var(--green);white-space:nowrap}
.rep-empty{font-size:12px;color:var(--tx2);padding:16px 4px;text-align:center}

.receipt{background:#fff;color:#1b1438;border-radius:18px;padding:22px 20px;margin-bottom:14px;position:relative;box-shadow:var(--shadow)}
.receipt:before,.receipt:after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 8px 0,transparent 6px,#fff 6.5px) 0 0/16px 10px repeat-x}
.receipt:before{top:-9px;transform:scaleY(-1)}
.receipt:after{bottom:-9px}
.receipt-biz{text-align:center;font-family:'Sora','Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:1.5px;font-size:15px}
.receipt-sub{text-align:center;font-size:11px;color:#6b6490;margin:3px 0 14px;padding-bottom:12px;border-bottom:1px dashed #b9b0e0}
.receipt-row,.receipt-total{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:12px}
.receipt-row span:first-child{color:#6b6490}
.receipt-row span:last-child,.receipt-row b{text-align:right;overflow-wrap:anywhere}
.receipt-row b.ok{color:#10a374}
.receipt-total{border-top:1px dashed #b9b0e0;margin-top:6px;padding-top:12px;font-size:16px;font-weight:800}
.receipt-foot{text-align:center;font-size:11px;color:#6b6490;margin-top:14px}

.trend-chart{display:flex;gap:8px;align-items:flex-end}
.trend-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.trend-pair{height:130px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;border-bottom:1px solid var(--bd);background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--bd) 32px)}
.trend-pair i,.trend-legend i{display:block;border-radius:6px 6px 2px 2px;transition:filter .2s}
.trend-pair i{width:min(42%,18px);min-height:3px}
.trend-pair i:hover{filter:brightness(1.2)}
.tb-debt{background:linear-gradient(180deg,#b57aff,#6c5cff)}
.tb-paid{background:linear-gradient(180deg,#5cf0be,#12a678)}
.trend-lbl{font-size:10px;font-weight:700;color:var(--tx2);text-transform:capitalize}
.trend-val{display:flex;flex-direction:column;align-items:center;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;line-height:1.5}
.trend-val .v-d{color:var(--purple)}.trend-val .v-p{color:var(--green)}
.trend-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:11px;color:var(--tx2)}
.trend-legend span{display:inline-flex;align-items:center;gap:7px}
.trend-legend i{width:10px;height:10px;border-radius:3px}

.aging-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--bg3);margin-bottom:14px;gap:2px}
.aging-bar span{display:block;height:100%;min-width:4px}
.aging-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bd)}
.aging-row:last-child{border-bottom:0}
.aging-row i{width:10px;height:10px;border-radius:4px;flex:0 0 10px}
.aging-l{flex:1;min-width:0}
.aging-l b{display:block;font-size:12px}
.aging-l small{font-size:10px;color:var(--tx2)}
.aging-a{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12px;white-space:nowrap}

.risk-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:transform .2s}
.risk-row:hover{transform:translateX(4px)}
.risk-info{flex:1;min-width:0}
.risk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.risk-top b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risk-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;flex:0 0 auto}
.risk-bar{height:6px;background:var(--bg3);border-radius:999px;overflow:hidden}
.risk-bar span{display:block;height:100%;border-radius:inherit}
.risk-info small{display:block;font-size:10px;color:var(--tx2);margin-top:6px}
.risk-note{font-size:10px;color:var(--tx3);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
@media(max-width:380px){.lock-pad button{width:64px;height:64px;font-size:22px}.trend-val{font-size:7px}}
