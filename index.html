<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b1024"><link rel="manifest" href="manifest.json"><title>Buku Utang WiFi — Mikasa Field Ledger</title>
<style>
:root{--wine:#4b1024;--red:#df426b;--bg:#10090e;--panel:#21121b;--line:#79455b;--muted:#c6aeba;--gold:#f1d4a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 15%,#401126,transparent 45%),#0d090c;color:#fff;font:16px system-ui;padding-bottom:100px}header{position:sticky;top:0;background:linear-gradient(110deg,#390b1c,#64152f);border-bottom:3px solid var(--red);padding:20px;z-index:2}.brand{font-size:22px;font-weight:bold}.sub{font-size:11px;letter-spacing:3px;color:#e5bdcb}main{max-width:760px;margin:auto;padding:18px 14px}.stats{display:flex;gap:9px;margin-bottom:16px}.stat{flex:1;background:#20121a;border:1px solid var(--line);border-radius:12px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;color:var(--gold);margin-top:5px}.tools{display:flex;gap:8px;margin-bottom:15px}.tools input{flex:1;min-width:0}input,select,textarea{font:inherit;color:white;background:#160d13;border:1px solid var(--line);border-radius:9px;padding:11px;width:100%}.list{display:grid;gap:13px}.customer{display:flex;align-items:center;gap:11px;padding:13px 10px;background:linear-gradient(110deg,#2a1420,#160d14);border:1px solid #805066;border-left:5px solid #a92d52;border-radius:16px}.avatar{width:62px;height:62px;flex-shrink:0;border:2px solid #c16b8b;border-radius:50%;background:#521a30;display:grid;place-items:center;font-size:24px}.person{flex:1;min-width:0;cursor:pointer}.name{font-weight:700;overflow-wrap:anywhere}.details,.status{font-size:12px;color:var(--muted);margin-top:5px}.balance{text-align:right;font-weight:bold;color:var(--gold);font-size:14px}.menu{background:none;border:0;color:#e780a1;font-size:27px}.notice{border:1px solid var(--line);border-left:5px solid var(--red);padding:13px;margin-top:22px;color:var(--muted);font-size:13px}.fab{position:fixed;right:24px;bottom:32px;border-radius:50%;height:78px;width:78px;border:4px solid #e9ffc3;background:linear-gradient(#caff79,#6ad400);font-size:42px;color:#21350b;box-shadow:0 0 22px #8ce94d88}.overlay{position:fixed;inset:0;background:#000b;z-index:4;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:#1c1018;border:1px solid #87536b;border-radius:20px 20px 14px 14px;padding:20px;width:min(100%,560px);max-height:90vh;overflow:auto}.modal h2{margin:0 0 15px}.form{display:grid;gap:12px}.label{display:grid;gap:5px;font-size:13px;color:#ddc1cd}.actions,.menulist{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{background:#341724;color:white;border:1px solid #89556c;border-radius:10px;padding:11px 14px;font:inherit}.primary{background:#9f244b}.warn{background:#632036}.good{background:#385c20}.menulist{display:grid}.menulist button{text-align:left}.muted{color:var(--muted);font-size:13px}.ledger{border-top:1px solid #533344;margin-top:15px}.entry{padding:10px 0;border-bottom:1px solid #402735;font-size:13px}.entry small{display:block;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(min-width:600px){.overlay{align-items:center}.stats{gap:12px}}
</style></head><body><header><div class="brand">✦ BUKU UTANG WiFi</div><div class="sub">MIKASA FIELD LEDGER</div></header><main><div id="stats" class="stats"></div><div class="tools"><input id="search" placeholder="Cari nama pelanggan"><select id="filter" style="max-width:125px"><option value="active">Aktif</option><option value="archived">Arsip</option><option value="all">Semua</option></select></div><div id="list" class="list"></div><div class="notice">Audit transaksi dipertahankan. Ekspor backup rutin ke tempat terpisah.</div></main><button class="fab" onclick="addCustomer()">+</button><div id="root"></div>
<script>
const KEY='mikasa-wifi-ledger-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.customers))db={customers:[],audit:[]};if(!Array.isArray(db.audit))db.audit=[];
const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),date=()=>new Date().toISOString().slice(0,10),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saldo=c=>Math.max(0,c.debt-c.payments.reduce((a,p)=>a+p.amount,0)),find=i=>db.customers.find(c=>c.id===i);
function audit(action,c,detail=''){db.audit.unshift({action,name:c.name,customerId:c.id,detail,date:new Date().toISOString()})}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function modal(s){document.querySelector('#root').innerHTML='<div class="overlay" onclick="if(event.target===this)close()"><section class="modal">'+s+'</section></div>'}function close(){document.querySelector('#root').innerHTML=''}
function render(){let q=document.querySelector('#search').value.toLowerCase(),v=document.querySelector('#filter').value,active=db.customers.filter(c=>!c.archived),cs=db.customers.filter(c=>(v==='all'||(v==='active'?!c.archived:c.archived))&&c.name.toLowerCase().includes(q));document.querySelector('#stats').innerHTML=`<div class="stat"><small>Pelanggan aktif</small><b>${active.length}</b></div><div class="stat"><small>Sisa piutang</small><b>${rupiah(active.reduce((s,c)=>s+saldo(c),0))}</b></div>`;document.querySelector('#list').innerHTML=cs.length?cs.map(c=>`<article class="customer"><div class="avatar">${esc(c.name.charAt(0).toUpperCase())}</div><div class="person" onclick="detail('${c.id}')"><div class="name">${esc(c.name)} ${c.archived?'(Arsip)':''}</div><div class="details">Utang ${rupiah(c.debt)} · Bayar ${rupiah(c.payments.reduce((a,p)=>a+p.amount,0))}</div></div><div class="balance">${rupiah(saldo(c))}<div class="status">${saldo(c)?'Sisa piutang':'Lunas'}</div></div><button class="menu" onclick="customerMenu('${c.id}')">⋮</button></article>`).join(''):'<div class="empty">Belum ada pelanggan.</div>'}
function addCustomer(){modal(`<h2>Tambah pelanggan</h2><form class="form" id="new"><label class="label">Nama<input name="name" required maxlength="90"></label><label class="label">Utang awal (Rp)<input name="debt" type="number" min="0" required value="0"></label><label class="label">Catatan<textarea name="note"></textarea></label><div class="actions"><button class="btn primary">Simpan</button><button type="button" class="btn" onclick="close()">Batal</button></div></form>`);document.querySelector('#new').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),c={id:id(),name:f.get('name').trim(),debt:Number(f.get('debt')),note:f.get('note'),payments:[],archived:false};if(!c.name||c.debt<0)return;db.customers.unshift(c);audit('Pelanggan ditambahkan',c);close();persist()}}
function customerMenu(i){let c=find(i);modal(`<h2>${esc(c.name)}</h2><div class="menulist"><button class="btn" onclick="detail('${i}')">Detail & riwayat</button><button class="btn" onclick="edit('${i}')">Edit pelanggan</button>${c.archived?`<button class="btn good" onclick="restore('${i}')">Pulihkan arsip</button>`:`<button class="btn" onclick="archive('${i}')">Arsipkan pelanggan</button>`}<button class="btn warn" onclick="removeCustomer('${i}')">Hapus pelanggan</button><button class="btn" onclick="close()">Tutup</button></div><p class="muted">${saldo(c)?'Masih ada saldo utang. Penghapusan permanen diblokir.':'Penghapusan hanya diizinkan jika tidak ada riwayat pembayaran.'}</p>`)}
function detail(i){let c=find(i),paid=c.payments.reduce((a,p)=>a+p.amount,0);modal(`<h2>${esc(c.name)}</h2><p>Total utang: <b>${rupiah(c.debt)}</b><br>Total dibayar: <b>${rupiah(paid)}</b><br>Sisa: <b>${rupiah(saldo(c))}</b></p><p class="muted">${esc(c.note||'')}</p>${!c.archived&&saldo(c)?`<button class="btn good" onclick="pay('${i}')">Catat pembayaran</button>`:''}<div class="actions"><button class="btn" onclick="customerMenu('${i}')">Menu</button><button class="btn" onclick="close()">Tutup</button></div><div class="ledger"><b>Riwayat pembayaran</b>${c.payments.length?c.payments.slice().reverse().map(p=>`<div class="entry">${rupiah(p.amount)}<small>${esc(p.date)} · ${esc(p.note||'Pembayaran')}</small></div>`).join(''):'<p class="muted">Belum ada pembayaran.</p>'}</div>`)}
function pay(i){let c=find(i);modal(`<h2>Catat pembayaran</h2><p class="muted">${esc(c.name)} — sisa ${rupiah(saldo(c))}</p><form id="payment" class="form"><label class="label">Nominal (Rp)<input name="amount" type="number" min="1" max="${saldo(c)}" required></label><label class="label">Tanggal<input name="date" type="date" value="${date()}" required></label><label class="label">Catatan<input name="note"></label><div class="actions"><button class="btn primary">Simpan</button><button type="button" class="btn" onclick="detail('${i}')">Batal</button></div></form>`);document.querySelector('#payment').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),amount=+f.get('amount');if(amount<=0||amount>saldo(c))return alert('Nominal melewati sisa utang');c.payments.push({amount,date:f.get('date'),note:f.get('note')});audit('Pembayaran dicatat',c,rupiah(amount));close();persist()}}
function edit(i){let c=find(i);modal(`<h2>Edit pelanggan</h2><form id="edit" class="form"><label class="label">Nama<input name="name" required value="${esc(c.name)}"></label><label class="label">Catatan<textarea name="note">${esc(c.note||'')}</textarea></label><div class="actions"><button class="btn primary">Simpan</button><button type="button" class="btn" onclick="customerMenu('${i}')">Batal</button></div></form>`);document.querySelector('#edit').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);c.name=f.get('name').trim();c.note=f.get('note');audit('Data pelanggan diedit',c);close();persist()}}
function archive(i){let c=find(i);modal(`<h2>Arsipkan pelanggan?</h2><p>Data transaksi dan riwayat tetap dipertahankan. Pelanggan dapat dipulihkan nanti.</p><div class="actions"><button class="btn primary" onclick="confirmArchive('${i}')">Ya, arsipkan</button><button class="btn" onclick="customerMenu('${i}')">Batal</button></div>`)}
function confirmArchive(i){let c=find(i);c.archived=true;audit('Pelanggan diarsipkan',c);close();persist()}
function restore(i){let c=find(i);c.archived=false;audit('Pelanggan dipulihkan',c);close();persist()}
function removeCustomer(i){let c=find(i);if(saldo(c)>0){modal(`<h2>Hapus tidak diizinkan</h2><p>${esc(c.name)} masih memiliki sisa utang <b>${rupiah(saldo(c))}</b>. Arsipkan saja agar catatan tetap ada.</p><div class="actions"><button class="btn primary" onclick="archive('${i}')">Arsipkan</button><button class="btn" onclick="customerMenu('${i}')">Kembali</button></div>`);return}if(c.payments.length){modal(`<h2>Hapus tidak diizinkan</h2><p>Riwayat pembayaran ditemukan. Untuk menjaga audit, data pelanggan ini tidak dihapus permanen.</p><div class="actions"><button class="btn primary" onclick="archive('${i}')">Arsipkan</button><button class="btn" onclick="customerMenu('${i}')">Kembali</button></div>`);return}modal(`<h2>Konfirmasi hapus</h2><p>Hapus <b>${esc(c.name)}</b> secara permanen? Tindakan tidak bisa dibatalkan.</p><div class="actions"><button class="btn warn" onclick="confirmDelete('${i}')">Hapus permanen</button><button class="btn" onclick="customerMenu('${i}')">Batal</button></div>`)}
function confirmDelete(i){let c=find(i);if(!c||saldo(c)>0||c.payments.length)return;db.audit.unshift({action:'Pelanggan dihapus',name:c.name,detail:'Dihapus tanpa riwayat pembayaran',date:new Date().toISOString()});db.customers=db.customers.filter(x=>x.id!==i);close();persist()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-buku-utang-'+date()+'.json';a.click();URL.revokeObjectURL(a.href)}
function menu(){modal(`<h2>Menu aplikasi</h2><div class="menulist"><button class="btn" onclick="backup()">Ekspor backup JSON</button><button class="btn" onclick="auditView()">Audit transaksi</button><button class="btn" onclick="close()">Tutup</button></div><p class="muted">Data disimpan di browser/perangkat ini. Data tidak otomatis sinkron ke perangkat lain. Backup secara rutin.</p>`)}
function auditView(){modal(`<h2>Audit transaksi</h2><div class="ledger">${db.audit.length?db.audit.slice(0,100).map(a=>`<div class="entry"><b>${esc(a.action)}</b><small>${esc(a.name)} · ${new Date(a.date).toLocaleString('id-ID')}<br>${esc(a.detail)}</small></div>`).join(''):'<p class="muted">Belum ada aktivitas.</p>'}</div><div class="actions"><button class="btn" onclick="close()">Tutup</button></div>`)}
document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;document.querySelector('header').onclick=menu;render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
